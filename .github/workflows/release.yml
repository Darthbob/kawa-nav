name: Release

# Pushing a version tag (v0.6, …) builds both APKs signed with the release key and publishes them as
# a GitHub release. The key is kept in the "release" environment, which only v* tags may use; see
# docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APKs and GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the release and upload the APKs
    env:
      TAG: ${{ github.ref_name }}
      # this fork's release key, as in v0.4 and v0.5: an APK signed otherwise would not install over them
      CERT_SHA256: 1705d7a647e94ebdffa81d7e316c208a44d4f2b4825ce4ae0896c69020cffda4
    steps:
      # Actions are pinned to full commit SHAs, as in ci.yml; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag and app version agree
        run: |
          version=$(sed -n "s/^ *versionName '\(.*\)'.*$/\1/p" app/build.gradle)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG, but versionName is '$version' in app/build.gradle"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Same Gradle as CI (see ci.yml). No cache: a release is built from the tagged sources only.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.14.6'
          cache-provider: basic
          cache-disabled: true

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PROPERTIES" ]; then
            echo "::error::KEYSTORE_BASE64 or KEYSTORE_PROPERTIES is missing in the release environment, see docs/RELEASING.md"
            exit 1
          fi
          # mask each password on its own too, should a tool ever print one
          printf '%s\n' "$KEYSTORE_PROPERTIES" | tr -d '\r' \
            | sed -n 's/^[[:space:]]*\(storePassword\|keyPassword\)[[:space:]]*[=:][[:space:]]*//p' \
            | while IFS= read -r value; do [ -z "$value" ] || echo "::add-mask::${value//%/%25}"; done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # the local keystore.properties, with the keystore's path on this runner
          { printf '%s\n' "$KEYSTORE_PROPERTIES" | tr -d '\r' | grep -v '^[[:space:]]*storeFile[[:space:]]*[=:]'
            echo "storeFile=$RUNNER_TEMP/release.jks"; } > keystore.properties

      - name: Build signed APKs
        run: gradle assembleRelease assembleDebug testDebugUnitTest

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

      - name: Check the signing key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            if ! grep -qx "Signer #1 certificate SHA-256 digest: $CERT_SHA256" <<<"$certs" \
                || grep -q "Signer #2" <<<"$certs"; then
              echo "::error::$apk is not signed with the release key"
              exit 1
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/KawaNav-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/KawaNav-$TAG-debug.apk"
          notes="docs/releases/$TAG.md"
          {
            echo "> **Safety:** KawaNav is a riding aid, not a safety system. Directions and curves can be late, missing or wrong. Always ride by what you see on the road. No warranty. Not affiliated with Kawasaki or Google."
            echo
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo "### Verify the APK"
            echo "- \`KawaNav-$TAG.apk\` SHA-256: \`$(sha256sum "dist/KawaNav-$TAG.apk" | cut -d' ' -f1)\` (built from commit \`${GITHUB_SHA:0:7}\` by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))"
            echo "- \`KawaNav-$TAG-debug.apk\` SHA-256: \`$(sha256sum "dist/KawaNav-$TAG-debug.apk" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\` (this fork's key, not Darthbob's)"
            echo
            echo "Free software under the GNU GPL v3, modified from Darthbob's KawaNav; the source of this version is attached below. Road data © OpenStreetMap contributors (ODbL)."
          } > "$RUNNER_TEMP/notes.md"
          # without notes for this version, GitHub's list of changes follows the text above
          generate=()
          [ -f "$notes" ] || generate=(--generate-notes)
          # a draft first, published once both APKs are uploaded
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "KawaNav $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${generate[@]}" dist/*.apk
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
