name: Release

# A push to main whose versionName (app/build.gradle) has no tag yet is released: both APKs signed
# with the release key, tag v<versionName> and a GitHub release with the changes from
# changelog.json. The in-app updater then offers it. See docs/RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.new.outputs.release }}
    steps:
      # Actions are pinned to full commit SHAs, as in ci.yml; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags: released versions
          persist-credentials: false

      - name: Version and changelog
        id: version
        run: .github/scripts/version.sh

      - name: Released already?
        id: new
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$prev" ]; then
            prev_code=$(git show "$prev:app/build.gradle" | sed -n 's/^ *versionCode \([0-9][0-9]*\).*/\1/p')
            if [ "$CODE" -le "$prev_code" ]; then
              echo "::error file=app/build.gradle::versionCode $CODE must be higher than $prev_code of $prev, or Android refuses the update"
              exit 1
            fi
          fi
          echo "Releasing v$VERSION (previous: ${prev:-none})"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Signed APKs and GitHub release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # the release key is in this environment's secrets, which only main may use
    environment: release
    permissions:
      contents: write # create the release and upload the APKs
    env:
      TAG: v${{ needs.check.outputs.version }}
      # Darthbob's release key (v0.1 on): an APK signed otherwise does not install over the app
      CERT_SHA256: 7e9575b361224e88803f075caa6ee7373066901f701d31a619e47cc2f7cce08b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Same Gradle as CI (see ci.yml). No cache: a release is built from its sources only.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
          cache-provider: basic
          cache-disabled: true

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets missing in the release environment, see docs/RELEASING.md"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build signed APKs
        run: gradle assembleRelease assembleDebug testDebugUnitTest

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties

      - name: Check the signing key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Using $apksigner"
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            # every certificate the APK is signed with (all schemes), one line each
            digests=$(grep -i "certificate SHA-256 digest" <<<"$certs" | sed 's/.*digest:[[:space:]]*//' \
              | tr -d '\r' | tr 'A-F' 'a-f' | sort -u)
            if [ "$digests" != "$CERT_SHA256" ]; then
              echo "::error::$apk is signed with '${digests:-no certificate}', not the release key"
              grep -iv " DN: " <<<"$certs" || true
              exit 1
            fi
            echo "$apk: release key"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          # the in-app updater downloads exactly KawaNav-v<versionName>.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/KawaNav-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/KawaNav-$TAG-debug.apk"
          notes="docs/releases/$TAG.md"
          {
            echo "> **Safety:** KawaNav is a riding aid, not a safety system. Directions and curves can be late, missing or wrong. Always ride by what you see on the road. No warranty. Not affiliated with Kawasaki or Google."
            echo
            jq -r --arg v "${TAG#v}" '.versions[] | select(.version == $v) | .changes[] | "- " + .' changelog.json
            echo
            if [ -f "$notes" ]; then cat "$notes"; echo; fi
            echo "### Install / update"
            echo "KawaNav 1.0 and newer offers updates itself when you open it. Or download \`KawaNav-$TAG.apk\` below and open it on the phone (Android 13+); it installs over earlier versions and keeps your settings and maps. \`KawaNav-$TAG-debug.apk\` is the same version with debug tools. New install: see the [README](../../blob/$TAG/README.md)."
            echo
            echo "### Verify the APK"
            echo "- \`KawaNav-$TAG.apk\` SHA-256: \`$(sha256sum "dist/KawaNav-$TAG.apk" | cut -d' ' -f1)\` (built from commit \`${GITHUB_SHA:0:7}\` by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))"
            echo "- \`KawaNav-$TAG-debug.apk\` SHA-256: \`$(sha256sum "dist/KawaNav-$TAG-debug.apk" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256: \`$CERT_SHA256\` (same as all earlier versions)"
            echo
            echo "Free software under the GNU GPL v3. Road data © OpenStreetMap contributors (ODbL)."
          } > "$RUNNER_TEMP/notes.md"
          # a draft first, published (and tagged) once both APKs are uploaded
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "KawaNav $TAG" --notes-file "$RUNNER_TEMP/notes.md" dist/*.apk
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
