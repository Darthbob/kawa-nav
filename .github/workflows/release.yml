name: Release

# Every push to main is built. When versionName in app/build.gradle has no tag yet, it is released:
# signed APK, tag v<versionName> and a GitHub release with the changes from changelog.json. The
# in-app updater then offers it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Certificate of the release key (v0.1 on): an APK signed otherwise cannot update installed apps
  SIGNING_CERT_SHA256: 7e9575b361224e88803f075caa6ee7373066901f701d31a619e47cc2f7cce08b

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.new.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags: released versions
      - name: Version and changelog
        id: version
        run: .github/scripts/version.sh
      - name: New version?
        id: new
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released: build only"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$prev" ]; then
            prev_code=$(git show "$prev:app/build.gradle" | sed -n 's/^ *versionCode \([0-9][0-9]*\).*/\1/p')
            if [ "$CODE" -le "$prev_code" ]; then
              echo "::error file=app/build.gradle::versionCode $CODE must be higher than $prev_code of $prev, or Android refuses the update"
              exit 1
            fi
          fi
          echo "Releasing v$VERSION (previous: ${prev:-none})"
          echo "release=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        if: steps.new.outputs.release != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        if: steps.new.outputs.release != 'true'
        with:
          gradle-version: 9.3.1
      - name: Build
        if: steps.new.outputs.release != 'true'
        run: gradle assembleDebug

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    # the signing key lives in this environment's secrets; it can require an approval per release
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.1
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets missing in the \"release\" environment (see AGENTS.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build
        run: gradle assembleRelease
      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          apk=app/build/outputs/apk/release/app-release.apk
          cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$cert" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error::APK signed with $cert, expected $SIGNING_CERT_SHA256"
            exit 1
          fi
          cp "$apk" "KawaNav-v$VERSION.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="KawaNav-v$VERSION.apk"
          {
            jq -r --arg v "$VERSION" '.versions[] | select(.version == $v) | .changes[] | "- " + .' changelog.json
            echo
            echo "> **Safety:** KawaNav is a riding aid, not a safety system. Directions and curves can be late, missing or wrong. Always ride by what you see on the road. No warranty. Not affiliated with Kawasaki or Google."
            echo
            echo "### Install / update"
            echo "KawaNav 0.4 or newer offers this update itself when you open it. Or download \`$apk\` below and open it on the phone (Android 13+); it installs over earlier versions and keeps maps and settings. New install: see the [README](../../blob/v$VERSION/README.md#-install)."
            echo
            echo "### Verify the APK"
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256: \`$SIGNING_CERT_SHA256\` (same as all earlier versions)"
            echo
            echo "Free software under the GNU GPL v3. Road data © OpenStreetMap contributors (ODbL)."
          } > notes.md
          gh release create "v$VERSION" "$apk" --title "KawaNav v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
