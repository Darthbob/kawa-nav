plugins {
    id 'com.android.application'
}

// Release signing: keystore.properties (git-ignored) in the project root holds storeFile,
// storePassword, keyAlias and keyPassword. Without it, release builds stay unsigned.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'io.github.darthbob.kawanav'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.darthbob.kawanav'
        minSdk 33
        targetSdk 36
        versionCode 36
        versionName '1.4.0'
    }

    // BuildConfig.DEBUG: the debug card (dash icon tests, phone name, Bluetooth service list) only in debug builds
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    // Lint: a new warning fails the build (CI runs lintDebug; assembleRelease runs lintVitalRelease).
    // The warnings the code had when this was switched on are in lint-baseline.xml: fix them when
    // touching that code, and delete the entry from the baseline. The texts are string resources in
    // every language (Lang); a text set in code is a developer's (logs, debug tools), so those two checks
    // are off. MissingTranslation stays on: a language without a text fails the build.
    lint {
        warningsAsErrors = true
        abortOnError = true
        baseline = file('lint-baseline.xml')
        disable += ['SetTextI18n', 'HardcodedText']
        // the orientation is fixed on purpose: the app is used on a bike, one hand, portrait
        disable += ['LockedOrientationActivity']
        // a Gradle plugin or SDK update is Dependabot's job, not a build failure
        disable += ['GradleDependency', 'OldTargetApi', 'AndroidGradlePluginVersion']
    }

    buildTypes {
        debug {
            minifyEnabled false
            // with the release key where there is one (not in CI): the debug APK of a release then
            // installs over the normal one and back, keeping rides and settings
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
}

// Parser and recorder tests run on the JVM (app/src/test); the app itself has no dependencies.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
